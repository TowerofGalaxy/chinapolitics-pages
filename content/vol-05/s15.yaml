  label: 坚持票决过半刚性门槛，严禁行政干预投票结果
  outcome: s15-a.md
  effects:
  - type: change
    stat: reform_drive
    amount: 6
  - type: change
    stat: central_trust
    amount: -8
  - type: change
    stat: local_cohesion
    amount: -5
