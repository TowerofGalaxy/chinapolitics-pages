- id: b
  label: 签发“民意降噪 + 实绩加权”双轨修正案（不唯票取人）
  outcome: s15-b.md
  effects:
  - type: change
    stat: central_trust
    amount: 5
  - type: change
    stat: central_trust
    amount: 2
    when:
      any:
      - tag: 基层测评原始样表
      - tag: 无暇履历
      - tag: 宏观定力
  - type: change
    stat: reform_drive
    amount: 5
  - type: change
    stat: local_cohesion
    amount: -2
  - type: add-tag
    tag: 加权考核矩阵
  - type: add-tag
    tag: 加权考核执行损耗
  hint: 不能唯票取人，把实绩考核加权进去，替那些敢干事、得罪人的干部卸下包袱。
- id: c
  label: 收缩无记名投票权重，重回传统组织部门谈话查档为主
  outcome: s15-c.md
  effects:
  - type: change
    stat: central_trust
    amount: 4
  - type: change
    stat: local_cohesion
    amount: 4
  - type: change
    stat: reform_drive
    amount: -8
  - type: add-tag
    tag: 测评退回旧轨失望
  hint: 既然民意测评被钻了空子，不如退一步，重回组织部门深入谈话的传统路子。
